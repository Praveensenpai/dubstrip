[package]
name = "dubstrip"
version = "0.2.2"
edition = "2021"
authors = ["Praveensenpai <pvnt20@gmail.com>"]
description = "Autonomous, AI-augmented zero-loss dub stripper for movies & series"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
indicatif = "0.17"
